<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Pratigya 🎉</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #ff0000, #ff6b6b, #ff1744);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Confetti animation */
        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            background: #ff0000;
            animation: fall 3s ease-in infinite;
            pointer-events: none;
        }

        @keyframes fall {
            to {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.95);
            padding: 50px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            z-index: 10;
            animation: slideUp 0.8s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            font-size: 3.5em;
            color: #ff0000;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
            animation: bounce 1s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .name {
            font-size: 2.5em;
            color: #ff1744;
            margin: 20px 0;
            font-weight: bold;
        }

        .message {
            font-size: 1.3em;
            color: #333;
            margin: 30px 0;
            line-height: 1.6;
            font-style: italic;
        }

        .birthday-date {
            font-size: 1.1em;
            color: #666;
            margin: 20px 0;
        }

        .countdown-container {
            margin: 40px 0;
        }

        .countdown-title {
            font-size: 1.5em;
            color: #ff0000;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .countdown {
            display: flex;
            justify-content: space-around;
            gap: 15px;
            flex-wrap: wrap;
        }

        .time-unit {
            background: linear-gradient(135deg, #ff0000, #ff6b6b);
            color: white;
            padding: 20px;
            border-radius: 10px;
            min-width: 80px;
            box-shadow: 0 5px 15px rgba(255, 0, 0, 0.3);
        }

        .time-value {
            font-size: 2em;
            font-weight: bold;
            display: block;
        }

        .time-label {
            font-size: 0.9em;
            margin-top: 5px;
        }

        .emoji {
            font-size: 3em;
            margin: 20px 0;
            animation: spin 2s linear infinite;
        }

        @keyframes spin {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(180deg); }
        }

        .button {
            background: linear-gradient(135deg, #ff0000, #ff1744);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2em;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 30px;
            box-shadow: 0 5px 15px rgba(255, 0, 0, 0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .button:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(255, 0, 0, 0.4);
        }

        .button:active {
            transform: scale(0.95);
        }

        .author {
            margin-top: 30px;
            font-size: 0.9em;
            color: #999;
            border-top: 1px solid #ddd;
            padding-top: 20px;
        }

        .balloons {
            position: fixed;
            width: 50px;
            height: 70px;
            border-radius: 50% 50% 50% 0;
            animation: float 4s ease-in-out infinite;
            pointer-events: none;
        }

        .balloon1 {
            background: #ff0000;
            left: 5%;
            animation-delay: 0s;
        }

        .balloon2 {
            background: #ff6b6b;
            left: 10%;
            animation-delay: 1s;
        }

        .balloon3 {
            background: #ff1744;
            right: 5%;
            animation-delay: 2s;
        }

        @keyframes float {
            0% {
                bottom: -100px;
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                bottom: 100vh;
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="balloons balloon1"></div>
    <div class="balloons balloon2"></div>
    <div class="balloons balloon3"></div>

    <div class="container">
        <div class="emoji">🎉</div>
        <h1>Happy Birthday!</h1>
        <div class="name">Pratigya</div>
        
        <div class="message">
            "You are my best friend"
        </div>

        <div class="birthday-date">
            Born: 17th October 2007
        </div>

        <div class="countdown-container">
            <div class="countdown-title">Next Birthday Countdown</div>
            <div class="countdown">
                <div class="time-unit">
                    <span class="time-value" id="days">0</span>
                    <span class="time-label">Days</span>
                </div>
                <div class="time-unit">
                    <span class="time-value" id="hours">0</span>
                    <span class="time-label">Hours</span>
                </div>
                <div class="time-unit">
                    <span class="time-value" id="minutes">0</span>
                    <span class="time-label">Minutes</span>
                </div>
                <div class="time-unit">
                    <span class="time-value" id="seconds">0</span>
                    <span class="time-label">Seconds</span>
                </div>
            </div>
        </div>

        <button class="button" onclick="celebrate()">🎊 Celebrate! 🎊</button>

        <div class="author">
            Created with ❤️ by Akash
        </div>
    </div>

    <script>
        // Countdown Timer
        function updateCountdown() {
            const today = new Date();
            let nextBirthday = new Date(today.getFullYear(), 9, 17); // October 17 (month is 0-indexed)
            
            if (today > nextBirthday) {
                nextBirthday = new Date(today.getFullYear() + 1, 9, 17);
            }

            const distance = nextBirthday - today;

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById('days').textContent = days;
            document.getElementById('hours').textContent = hours;
            document.getElementById('minutes').textContent = minutes;
            document.getElementById('seconds').textContent = seconds;
        }

        setInterval(updateCountdown, 1000);
        updateCountdown();

        // Celebrate Function
        function celebrate() {
            createConfetti();
            playSound();
        }

        // Create Confetti
        function createConfetti() {
            for (let i = 0; i < 50; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + '%';
                confetti.style.backgroundColor = ['#ff0000', '#ff6b6b', '#ff1744', '#fff', '#ffd700'][Math.floor(Math.random() * 5)];
                confetti.style.animationDelay = Math.random() * 0.5 + 's';
                confetti.style.animationDuration = (Math.random() * 2 + 2) + 's';
                document.body.appendChild(confetti);

                setTimeout(() => confetti.remove(), 5000);
            }
        }

        // Simple sound effect (if supported)
        function playSound() {
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();

            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);

            oscillator.frequency.value = 800;
            gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);

            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.5);
        }

        // Auto confetti on page load
        window.addEventListener('load', () => {
            setTimeout(() => createConfetti(), 500);
        });
    </script>
</body>
</html>
